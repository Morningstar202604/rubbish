# Rubbish dev stack — Postgres + backend.
#
# Usage:
#   1. cp apps/backend/.env.example .env   # then fill in real secrets
#   2. docker compose -f infra/docker-compose.yml up --build
#   3. open http://localhost:8000/docs
#
# The backend service reads RUBBISH_* vars from the project-root ``.env``
# (env_file below). Only ``RUBBISH_DATABASE_URL`` is overridden here so
# the app talks to the ``postgres`` service instead of ``localhost``.
#
# Run one-off migrations without starting the server:
#   docker compose -f infra/docker-compose.yml run --rm \
#     backend alembic upgrade head

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rubbish
      POSTGRES_USER: rubbish
      POSTGRES_PASSWORD: rubbish_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubbish"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: rubbish_dev_meili_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q 'status.*available'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      # Override the .env's localhost URL to point at the compose service.
      RUBBISH_DATABASE_URL: postgresql+asyncpg://rubbish:rubbish_dev@postgres:5432/rubbish
      RUBBISH_MEILISEARCH_URL: http://meilisearch:7700
      RUBBISH_MEILISEARCH_API_KEY: rubbish_dev_meili_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # If .env already runs migrations on boot (the image's default CMD),
    # this override keeps the same behavior. Drop it to start uvicorn only.
    restart: unless-stopped

  # Vite dev server with hot reload — matches the "Postgres + backend +
  # frontend" dev stack promised in the README. Source is bind-mounted so
  # edits on the host land instantly; node_modules stays in an anonymous
  # volume so the Linux container doesn't clobber a host install.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      # Reach the backend by compose service name, not localhost.
      VITE_PROXY_TARGET: http://backend:8000
      # Reliable change detection for bind mounts across platforms.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  meilisearch_data:
