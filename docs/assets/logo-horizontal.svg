<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rubbish 横版组合（Lockup）—— 图形标 + 衬线字标
  用途：README / 文档页头 / 页眉等横向空间；
  深色背景用 logo-horizontal-white.svg。
  图形标为「印章之 R」，与 favicon.svg / logo-mark.svg 同几何。
  字标采用 Georgia / Times 系衬线，延续学术出版传统。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" aria-label="Rubbish">
  <!-- 印章之 R（mark，64 盒 × 1.875 = 120px，与 favicon.svg 同几何） -->
  <g transform="translate(10,15) scale(1.875)">
    <rect width="64" height="64" rx="12" fill="#16324F"/>
    <rect x="8" y="8" width="48" height="48" rx="5" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="32" y="44" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="600" fill="#FFFFFF">R</text>
    <path d="M 50.5 44.5 L 56 50 L 50.5 55.5 L 45 50 Z" fill="#C7A24B"/>
  </g>

  <!-- 字标 -->
  <text x="148" y="88" font-family="Georgia,'Times New Roman',serif" font-size="58"
        font-weight="700" letter-spacing="1" fill="#16324F">Rubbish</text>
  <text x="152" y="118" font-family="Georgia,'Times New Roman',serif" font-size="14"
        letter-spacing="6.5" fill="#5A6B7C">OPEN SCHOLARLY PUBLISHING</text>
</svg>
